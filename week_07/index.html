<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford Landing</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

    <style>

        /* a - colour white - text-decoration-line */
        body{
            width: 1920px;
            height: 2160px;
            margin: 0 auto;
            font-family: Bebas Neue;
            font-size: 13pt; 
            color: white;
        }

        .hero{
            width: 100%;
            height: 1080px;
        }

        .logo{
            margin: 88px 105px;
            position: absolute;
        }

        .sitenav {
            display: flex;
            justify-content: space-between;
            position: absolute;
            margin: 93px 262px;
            width: 421px;
            height: 19px;
        }

        .custnav{
            display: flex;
            position: absolute;
            margin: 93px 1631px;
            width: 219px;
            height: 19px;
            justify-content: space-between;
        }

        .locate{
            margin-left: -10px;
        }

        .copy{
            position: absolute;
            margin: 748px 105px;
            width: 233px;
            height: 187px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
        }

        .item1{
            font-size: 25pt;
        }

        .item2{
            font-size: 55pt;
            margin: -14px 0
        }

        .item3{
            font-size: 25pt;
        }

        .item4{
            font-size: 16pt;
            text-decoration: underline;
        }

        .buttons{
            position: absolute;
            display: flex;
            margin: 982px 105px;
            width: 350px;
            height: 40px;
            justify-content: space-between;
        }

        .btn1{
            background-color: white;
            color: black;
            padding: 10px 35px;
            border-radius: 20px;
        }

        .btn2{
            border: 1px white solid;
            padding: 10px 40px;
            border-radius: 20px;
        }

    </style>
</head>
<body>
    
    <div class="logo">
        <img src="images/FordOval.svg.png" alt="ford logo">
    </div>

    <div class="sitenav">
        <div> VEHICLES </div>
        <div> SHOP </div>
        <div> SUPPORT & SERVICE </div>
        <div> FORD PRO SOLUTIONS </div>
    </div>

    <div class="custnav">
        <div> <img src="images/search-v2-white.png" alt="search icon"></div>
        <div><img src="images/location-outline-v2-white.png" alt="locate icon"></div>
        <div class="locate">LOCATE DEALER</div>
        <div><img src="images/account-outline-v2-white.png" alt="account icon"></div>
        <div><img src="images/globe-v2-white.png" alt="globe icon"></div>
    </div>

    <div class="copy">
        <div class="item1"> 2026 </div>
        <div class="item2">ESCAPE<sup>®</sup></div>
        <div class="item3">STARTING AT $30,350<sup>1</sup> </div>
        <div class="item4">DETAILS</div>
    </div>

    <div class="buttons">
        <div class="btn1">search invantory</div>
        <div class="btn2">2025 escape</div>
    </div>

    <div class="hero">
        <img src="images/hero_car.png" alt="car ad">
    </div>
<!-- bottom half goes here -->

</body>
</html>
